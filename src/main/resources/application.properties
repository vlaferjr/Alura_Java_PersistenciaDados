spring.application.name=Grupo-pedidos

#locacalhost pq está em ambiente local, gerenciador-pedidos é o nome do banco
spring.datasource.url=jdbc:postgresql://localhost/gerenciador-pedidos
#nomeusuário
spring.datasource.username=postgres
#senha
spring.datasource.password=123456
#driver do banco
spring.datasource.driver-class-name=org.postgresql.Driver
#dialeto
hibernate.dialect=org.hibernate.dialect.HSQLDialect

#informar que se tiver altereção nas classes, atualizar no banco
spring.jpa.hibernate.ddl-auto=update